name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.9'

jobs:
  test:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg cmake fonts-wqy-zenhei
      - name: Native audio core tests (C)
        run: packages/yintrace_audio/tool/run_native_tests.sh
      - name: Build native core for host
        run: |
          cmake -S packages/yintrace_audio/src -B build/host -DCMAKE_BUILD_TYPE=Release
          cmake --build build/host
      - run: flutter pub get
      - run: flutter analyze
      - name: Plugin tests
        working-directory: packages/yintrace_audio
        run: |
          flutter pub get
          YINTRACE_AUDIO_LIB=$GITHUB_WORKSPACE/build/host/libyintrace_audio.so flutter test
      - name: Cache the UVR models
        uses: actions/cache@v4
        with:
          path: build/uvr-models
          key: uvr-models-534b2070-4ce7eaaa
      - name: Fetch the UVR models (same files the app downloads)
        run: tools/fetch_models.sh build/uvr-models
      # MODELS_DIR turns on the test that assembles the real karaoke model
      # with the recipe bundled in the app and checks its SHA-256.
      - name: App tests
        run: >
          YINTRACE_AUDIO_LIB=$GITHUB_WORKSPACE/build/host/libyintrace_audio.so
          MODELS_DIR=$GITHUB_WORKSPACE/build/uvr-models
          SCREENSHOT_DIR=build/screenshots flutter test
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: build/screenshots

  model-tools:
    name: Model recipe (PyTorch vs ONNX Runtime)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch && pip install onnx onnxscript onnxruntime numpy
      - name: Round trip with random weights
        run: python tools/build_karaoke_graph.py selftest
      - name: Cache the UVR models
        uses: actions/cache@v4
        with:
          path: build/uvr-models
          key: uvr-models-534b2070-4ce7eaaa
      - run: tools/fetch_models.sh build/uvr-models
      - name: Assemble the real model from the bundled recipe and compare with PyTorch
        run: python tools/build_karaoke_graph.py verify build/uvr-models/6_HP-Karaoke-UVR.pth

  real-models:
    name: Real models (Dart separation vs UVR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch && pip install numpy scipy librosa soundfile onnxruntime
      - name: Cache the UVR models
        uses: actions/cache@v4
        with:
          path: build/uvr-models
          key: uvr-models-534b2070-4ce7eaaa
      - run: tools/fetch_models.sh build/uvr-models
      - name: Get UVR's own inference code
        run: |
          git init -q build/uvr
          git -C build/uvr remote add origin https://github.com/Anjok07/ultimatevocalremovergui
          git -C build/uvr fetch -q --depth 1 --filter=blob:none origin a5f88453bfb2b38b05a965bcf67727243e0cbf19
          git -C build/uvr checkout -q FETCH_HEAD -- lib_v5/spec_utils.py lib_v5/vr_network
      - name: Separate a clip with UVR's code and the real models
        run: python tools/reference/make_real_reference.py --uvr build/uvr --models build/uvr-models --out build/real-reference
      - run: flutter pub get
      - name: Separate the same clip with the app's Dart code and compare
        run: >
          MODELS_DIR=$GITHUB_WORKSPACE/build/uvr-models
          REAL_REFERENCE=$GITHUB_WORKSPACE/build/real-reference
          PYTHON=python flutter test test/real_models_test.dart

  ios:
    name: iOS build (no codesign)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # An archive build runs the same strip step as a TestFlight/App Store build.
      - run: flutter build ipa --release --no-codesign
      - name: Check that the native audio core is reachable from dart:ffi
        run: |
          APP=build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app
          BIN="$APP/Runner"
          if [ -f "$APP/Frameworks/yintrace_audio.framework/yintrace_audio" ]; then
            BIN="$APP/Frameworks/yintrace_audio.framework/yintrace_audio"
          fi
          echo "checking exported symbols of $BIN"
          nm -gU "$BIN" > symbols.txt
          missing=0
          for s in $(grep -o "'yt_[a-z0-9_]*'" packages/yintrace_audio/lib/src/bindings.dart | tr -d "'" | sort -u); do
            grep -q " _$s\$" symbols.txt || { echo "missing symbol: $s"; missing=1; }
          done
          [ "$missing" = 0 ] && echo "all yt_* symbols exported"
          exit $missing
      - name: Package unsigned app
        run: cd build/ios/archive/Runner.xcarchive/Products/Applications && zip -qr "$GITHUB_WORKSPACE/Runner-unsigned.zip" Runner.app
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned
          path: Runner-unsigned.zip

  macos:
    name: macOS build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Native audio core tests (C, Core Audio decode path)
        run: packages/yintrace_audio/tool/run_native_tests.sh
      - run: flutter pub get
      - run: flutter build macos --debug
