name: yintrace
description: "YinTrace 唱歌练习：人声分离 + AI 音高模型逐字音高图 + YIN 实时音高对比"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  archive: ^4.7.1
  crypto: ^3.0.6
  cupertino_icons: ^1.0.8
  fftea: ^1.5.0
  ffi: ^2.1.3
  file_picker: ^13.3.3
  flutter_onnxruntime:
    path: packages/flutter_onnxruntime
  kana_kit: ^2.1.1
  path_provider: ^2.1.6
  wakelock_plus: ^1.8.2
  yintrace_audio:
    path: packages/yintrace_audio

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Of the separation models only the graph of the karaoke network and the
  # copy recipes are bundled; their weights are downloaded from the UVR
  # project on first use. The pitch model (SwiftF0, MIT, 135 KB) is bundled
  # (see assets/models/README.md).
  assets:
    - assets/models/mdx_graph.bin
    - assets/models/mdx_graph.json
    - assets/models/karaoke_graph.bin
    - assets/models/karaoke_graph.json
    - assets/models/swift_f0.onnx
    - assets/models/hubertfa-LICENSE.txt
    - assets/legal/user-terms-zh.txt
    - assets/licenses/
    - assets/mandarin/
  config:
    # All plugins are integrated through CocoaPods (the native audio core
    # ships a podspec only).
    enable-swift-package-manager: false
